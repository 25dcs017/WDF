<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        header {
            background: linear-gradient(135deg, #0f4c81, #1e88e5);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 60%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        }

        .container h2 {
            text-align: center;
            color: #1565c0;
            margin-bottom: 25px;
        }

        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }

        .setting label {
            font-weight: bold;
            color: #333;
        }

        .setting input[type="password"] {
            width: 220px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .setting input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        .setting select {
            width: 220px;
            padding: 8px;
            border-radius: 5px;
        }

        .button {
            text-align: center;
            margin-top: 30px;
        }

        .button button {
            background: #1565c0;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .button button:hover {
            background: #0f4c81;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            text-decoration: none;
            background: #0f4c81;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .back a:hover {
            background: #1565c0;
        }
    </style>

</head>

<body>

    <header>
        <h1>Settings</h1>
    </header>

    <div class="container">

        <h2>Account Settings</h2>

        <div class="setting">
            <label>Change Password</label>
            <input type="password" placeholder="New Password">
        </div>

        <div class="setting">
            <label>Email Notifications</label>
            <input type="checkbox" checked>
        </div>

        <div class="setting">
            <label>Dark Mode</label>
            <input type="checkbox">
        </div>

        <div class="setting">
            <label>Language</label>
            <select>
                <option>English</option>
                <option>Hindi</option>
                <option>Gujarati</option>
            </select>
        </div>

        <div class="setting">
            <label>Privacy Settings</label>
            <select>
                <option>Public</option>
                <option>Private</option>
            </select>
        </div>

        <div class="button">
            <button>Save Changes</button>
        </div>

        <div class="back">
             <a href="dashboard.html">⬅️ Back to Dashboard</a>
        </div>

    </div>
    <script>


        function toggleTheme() {

            document.body.classList.toggle("dark");

            let button = document.getElementById("themeButton");
            let checkbox = document.getElementById("darkModeCheckbox");

            if (document.body.classList.contains("dark")) {

                button.innerHTML = "☀️ Light";
                checkbox.checked = true;

            } else {

                button.innerHTML = "🌙 Dark";
                checkbox.checked = false;

            }
        }


        document.getElementById("darkModeCheckbox").addEventListener("change", function () {

            document.body.classList.toggle("dark", this.checked);

            let button = document.getElementById("themeButton");

            if (this.checked) {
                button.innerHTML = "☀️ Light";
            } else {
                button.innerHTML = "🌙 Dark";
            }

        });



        function toggleFAQ(button) {

            let answer = button.nextElementSibling;

            answer.classList.toggle("show");

            if (answer.classList.contains("show")) {
                button.innerHTML = button.innerHTML.replace("➕", "➖");
            } else {
                button.innerHTML = button.innerHTML.replace("➖", "➕");
            }

        }

    </script>


</body>

</html>
