<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
        }

        .container {
            width: 400px;
            background: linear-gradient(135deg, #0f4c81, #1e88e5);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #1565c0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e3f2fd;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            font-size: 15px;
        }

        .login a {
            color: #ffeb3b;
            text-decoration: none;
            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Create Account</h2>

        <form action="dashboard.html">


            <div class="input-box">
                <input type="text" placeholder="Full Name" required>
            </div>

            <div class="input-box">
                <input type="email" placeholder="Email Address" required>
            </div>

            <div class="input-box">
                <input type="text" placeholder="Username" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Confirm Password" required>
            </div>

            <button type="submit">Sign Up</button>


            <form action="home.html">
                <div class="login">
                    Already have an account?
                    <a href="home.html">Login</a>
                </div>
            </form>

        </form>

    </div>
    
    <script>
        function toggleTheme() {
            document.body.classList.toggle("dark");

            let button = document.getElementById("themeButton");

            if (document.body.classList.contains("dark")) {
                button.innerHTML = "☀️ Light";
            } else {
                button.innerHTML = "🌙 Dark";
            }
        }
    </script>

</body>

</html>
