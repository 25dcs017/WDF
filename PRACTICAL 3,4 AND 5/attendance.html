<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f7fb;
        }

        header {
            background: linear-gradient(135deg, #0f4c81, #1e88e5);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 80%;
            margin: 40px auto;
        }

        h2 {
            color: #0f4c81;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        th {
            background: #1565c0;
            color: white;
            padding: 15px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #eef5ff;
        }

        .good {
            color: green;
            font-weight: bold;
        }

        .average {
            color: orange;
            font-weight: bold;
        }

        .low {
            color: red;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
            text-align: center;
        }

        .back a {
            text-decoration: none;
            background: #1565c0;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .back a:hover {
            background: #0f4c81;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Attendance</h1>
    </header>

    <div class="container">

        <h2>Attendance Record</h2>

        <table>
            <tr>
                <th>Subject</th>
                <th>Total Classes</th>
                <th>Attended</th>
                <th>Percentage</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>Java Programming</td>
                <td>40</td>
                <td>36</td>
                <td>90%</td>
                <td class="good">Excellent</td>
            </tr>

            <tr>
                <td>Data Structures</td>
                <td>38</td>
                <td>31</td>
                <td>82%</td>
                <td class="good">Good</td>
            </tr>

            <tr>
                <td>Discrete Mathematics</td>
                <td>35</td>
                <td>28</td>
                <td>80%</td>
                <td class="average">Average</td>
            </tr>

            <tr>
                <td>Computer Networks</td>
                <td>36</td>
                <td>25</td>
                <td>69%</td>
                <td class="low">Need Improvement</td>
            </tr>

            <tr>
                <td>Web Development</td>
                <td>30</td>
                <td>29</td>
                <td>97%</td>
                <td class="good">Excellent</td>
            </tr>

        </table>

        <div class="back">
       <a href="dashboard.html">⬅️ Back to Dashboard</a>
        </div>

    </div>
    <script>

    function toggleTheme() {

        document.body.classList.toggle("dark");

        let button =
            document.getElementById("themeButton");


        if (document.body.classList.contains("dark")) {

            button.innerHTML = "☀️ Light";

        } else {

            button.innerHTML = "🌙 Dark";

        }

    }

</script>


</body>

</html>
