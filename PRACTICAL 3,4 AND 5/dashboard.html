<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f7fb;
        }

        header {
            background: linear-gradient(135deg, #0f4c81, #1e88e5);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        header h1 {
            font-size: 30px;
        }

        .logout {
            background: white;
            color: #1565c0;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .logout:hover {
            background: #e3f2fd;
        }

        .welcome {
            text-align: center;
            margin: 30px;
        }

        .welcome h2 {
            color: #0f4c81;
        }

        .welcome p {
            color: #555;
            margin-top: 10px;
        }

        .container {
            width: 90%;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .card a {
            text-decoration: none;
            color: #1565c0;
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
            background: #1565c0;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>

</head>

<body>

    <header>

        <h1>Student Portal Dashboard</h1>

        <a href="#" class="logout" onclick="logout()">Log Out</a>

    </header>

    <div class="welcome">

        <h2>Welcome to Your Dashboard</h2>

        <p>Select any option below.</p>

    </div>

    <div class="container">

        <div class="card">
            <a href="courses.html">📚 My Courses</a>
        </div>

        <div class="card">
            <a href="attendence.html">📝 Attendance</a>
        </div>

        <div class="card">
            <a href="result.html">📊 Result</a>
        </div>

        <div class="card">
            <a href="profile.html">👤 Profile</a>
        </div>

        <div class="card">
            <a href="settings.html">⚙️ Settings</a>
        </div>

        <div class="card">
            <a href="contact.html">📞 Contact Us</a>
        </div>

        <div class="card">
            <a href="ourcampus.html">🏫 Our Campus</a>
        </div>

    </div>

    <footer>
        © 2026 Student Portal | All Rights Reserved
    </footer>

  <script>


    function toggleMenu() {

        let menu = document.getElementById("navMenu");

        menu.classList.toggle("show");

    }


    function toggleTheme() {

        document.body.classList.toggle("dark");

        let button =
            document.getElementById("themeButton");

        if (document.body.classList.contains("dark")) {

            button.innerHTML = "☀️ Light";

        } else {

            button.innerHTML = "🌙 Dark";

        }

    }


    function closeNotification() {

        document.getElementById("notification")
            .style.display = "none";

    }


    function openModal() {

        document.getElementById("modal")
            .style.display = "flex";

    }


    function closeModal() {

        document.getElementById("modal")
            .style.display = "none";

    }


    let currentSlide = 0;

    let slides =
        document.querySelectorAll(".slide");


    function showSlide(index) {

        slides.forEach(function(slide) {

            slide.classList.remove("active");

        });

        slides[index].classList.add("active");

    }


    function nextSlide() {

        currentSlide++;

        if (currentSlide >= slides.length) {

            currentSlide = 0;

        }

        showSlide(currentSlide);

    }


    function previousSlide() {

        currentSlide--;

        if (currentSlide < 0) {

            currentSlide = slides.length - 1;

        }

        showSlide(currentSlide);

    }


    function logout() {

        let choice =
            confirm("Are you sure you want to log out?");

        if (choice) {

            window.location.href = "login.html";

        }

    }

</script>



</body>

</html>
