<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f7fb;
        }

        .container {
            width: 350px;
            background: linear-gradient(135deg, #0f4c81, #1e88e5);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            color: white;
        }

        h2 {
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        .forgot {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #1565c0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #e3f2fd;
        }

        .signup {
            margin-top: 20px;
            font-size: 15px;
        }

        .signup a {
            color: #ffeb3b;
            text-decoration: none;
            font-weight: bold;
        }

        .signup a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Login</h2>

        
        <form action="dashboard.html">

            <div class="input-box">
                <input type="text" placeholder="Username" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>

        </form>

       
        <form action="signup.html">
            <div class="signup">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </div>
        </form>
    </div>
<script>

    function toggleMenu() {

        const menu = document.getElementById("navLinks");

        menu.classList.toggle("show");

    }

    function toggleTheme() {

        document.body.classList.toggle("dark");

        const button =
            document.getElementById("themeButton");

        if (document.body.classList.contains("dark")) {

            button.innerHTML = "☀️ Light";

        } else {

            button.innerHTML = "🌙 Dark";

        }

    }

</script>


</body>

</html>
