<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        header {
            background: linear-gradient(135deg, #0f4c81, #1e88e5);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 60%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #1565c0;
            margin-bottom: 20px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .input-box input,
        .input-box textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #0f4c81;
        }

        .info {
            margin-top: 30px;
            line-height: 2;
        }

        .info h3 {
            color: #1565c0;
            margin-bottom: 10px;
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            background: #0f4c81;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .back a:hover {
            background: #1565c0;
        }
    </style>

</head>

<body>

    <header>
        <h1>Contact Us</h1>
    </header>

    <div class="container">

        <h2>Get in Touch</h2>

        <form>

            <div class="input-box">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <label>Subject</label>
                <input type="text" placeholder="Enter subject" required>
            </div>

            <div class="input-box">
                <label>Message</label>
                <textarea rows="5" placeholder="Write your message..." required></textarea>
            </div>

            <button type="submit">Send Message</button>

        </form>

        <div class="info">
            <h3>Contact Information</h3>
            <p><strong>Email:</strong> support@studentportal.com</p>
            <p><strong>Phone:</strong> +91 9876543210</p>
            <p><strong>Address:</strong> CHARUSAT University, Changa, Anand, Gujarat</p>
        </div>

        <div class="back">
        <a href="dashboard.html">⬅️ Back to Dashboard</a>
        </div>

    </div>
        <script>
        function toggleTheme() {
            document.body.classList.toggle("dark");

            let button = document.getElementById("themeButton");

            if (document.body.classList.contains("dark")) {
                button.innerHTML = "☀️ Light";
            } else {
                button.innerHTML = "🌙 Dark";
            }
        }
    </script>


</body>

</html>
