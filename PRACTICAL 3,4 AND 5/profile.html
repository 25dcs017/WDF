<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f7fb;
        }

        header {
            background: linear-gradient(135deg, #0f4c81, #1e88e5);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 60%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .profile-img {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-img img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #1565c0;
        }

        h2 {
            text-align: center;
            color: #1565c0;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        td:first-child {
            font-weight: bold;
            color: #0f4c81;
            width: 35%;
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            background: #1565c0;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .back a:hover {
            background: #0f4c81;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Profile</h1>
    </header>

    <div class="container">

        <div class="profile-img">
            <img src="https://via.placeholder.com/150" alt="Profile Photo">
        </div>

        <h2>Student Information</h2>

        <table>
            <tr>
                <td>Full Name</td>
                <td>Aastha Diyora</td>
            </tr>

            <tr>
                <td>Enrollment Number</td>
                <td>25DCS028</td>
            </tr>

            <tr>
                <td>Department</td>
                <td>Computer Science Engineering</td>
            </tr>

            <tr>
                <td>Semester</td>
                <td>3rd Semester</td>
            </tr>

            <tr>
                <td>Email</td>
                <td>aastha@gmail.com</td>
            </tr>

            <tr>
                <td>Phone</td>
                <td>+91 9876543210</td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td>28 september 2007</td>
            </tr>

            <tr>
                <td>Address</td>
                <td>Anand, Gujarat, India</td>
            </tr>
        </table>

        <div class="back">
            <a href="dashboard.html">⬅️ Back to Dashboard</a>
        </div>

    </div>
    <script>
        function toggleTheme() {

            document.body.classList.toggle("dark");

            let button = document.getElementById("themeButton");

            if (document.body.classList.contains("dark")) {
                button.innerHTML = "☀️ Light";
            } else {
                button.innerHTML = "🌙 Dark";
            }

        }
    </script>

</body>

</html>
